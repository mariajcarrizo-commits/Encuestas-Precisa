<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta PRECISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #16263B;
    --muted: #55657A;
    --line: #CBD4DF;
    --brand: #1F4E79;
    --pick: #1F7A5C;
    --pick-soft: #E3F3EC;
    --wa: #1E8E4E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
      --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
    --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
  header .tema { font-size: .85rem; margin: 2px 0 0; color: var(--muted); }
  header .titulos { display: flex; flex-direction: column; }
  .count { font-size: 1rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin: 12px 0 26px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .qnum { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--brand); margin: 0 0 10px; }
  .qtext { font-size: 1.3rem; font-weight: 700; margin: 0 0 22px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; font: inherit; font-size: 1.05rem; cursor: pointer; min-height: 64px;
  }
  .opt .letter {
    flex: 0 0 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; color: var(--muted);
  }
  .opt.sel { border-color: var(--pick); background: var(--pick-soft); }
  .opt.sel .letter { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700; padding: 14px 20px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #0F1722; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1722; } }
  .summary h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .summary p.lead { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; gap: 14px; background: var(--surface); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  }
  .row b { color: var(--brand); flex: 0 0 auto; font-size: 1.2rem; }
  .row .ans { font-size: 1rem; }
  .row .change { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .row.missing { border-color: #C0392B; }
  .send {
    display: block; width: 100%; margin-top: 18px; padding: 20px; font: inherit; font-size: 1.25rem;
    font-weight: 700; border: 0; border-radius: 14px; background: var(--wa); color: #fff; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .copy { display: block; width: 100%; margin-top: 10px; }
  .toast { text-align: center; color: var(--pick); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titulos">
      <h1>Encuesta PRECISA</h1>
      <p class="tema" id="tema"></p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main id="quiz">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Siguiente</button>
    </div>
  </main>

  <section class="summary hidden" id="summary">
    <h2>Listo, revisá tus respuestas</h2>
    <p class="lead">Tocá una respuesta si querés cambiarla. Después tocá el botón verde.</p>
    <div id="rows"></div>
    <a class="send" id="send" href="#" target="_top" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn copy" id="copy">Copiar respuestas</button>
    <p id="fallback" style="text-align:center; margin-top:14px;"></p>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script>
// Número de WhatsApp de destino (con código de país, sin + ni espacios, ej: 5491112345678).
// Si queda vacío, WhatsApp le pide elegir el contacto.
const WHATSAPP_NUMERO = "5491166478496";

// Tema de la encuesta actual: esta es la ÚNICA línea que hay que cambiar
// cada vez que llega una encuesta nueva. Va entre comillas.
const TEMA_ENCUESTA = "Epilepsia 1";

const PREGUNTAS = [
  { q: "Respecto a su práctica clínica habitual, ¿cuál de las siguientes opciones describe mejor el perfil de pacientes que recibe en su consulta?",
    o: ["Atiendo principalmente pacientes con cuadros de epilepsia: siendo este el foco central de mi actividad asistencial.",
        "Atiendo principalmente pacientes con trastornos de ansiedad: enfocando mi práctica en el área de la salud mental y trastornos del ánimo.",
        "Atiendo ambos perfiles de pacientes (epilepsia y ansiedad) de forma regular: manejando tanto patología neurológica como psiquiátrica.",
        "No suelo atender pacientes con estos diagnósticos en mi consulta actual: derivando estos casos a otros especialistas."] },
  { q: "En promedio, ¿cuántos pacientes bajo tratamiento con benzodiacepinas (por ansiedad o epilepsia) evalúa en su consulta mensualmente?",
    o: ["Más de 20 pacientes por mes.",
        "Entre 5 y 20 pacientes por mes.",
        "Menos de 5 pacientes por mes.",
        "Mi práctica actual no se centra en estas patologías, aunque recibo consultas esporádicas."] },
  { q: "En el abordaje de las epilepsias parciales que no responden al tratamiento convencional, ¿en qué perfil de paciente consideraría prioritaria la adición de Clobazam como terapia adjunta?",
    o: ["Tras el fracaso de fármacos antiepilépticos (FAE) de primera línea: para buscar sinergia mediante un mecanismo de acción benzodiacepínico.",
        "En pacientes que requieren estabilidad plasmática: aprovechando la vida media de eliminación estimada en 79 horas de su metabolito activo (N-desmetilclobazam).",
        "En pacientes con politerapia compleja: que buscan reducir crisis sin sumar interacciones significativas por ser un inhibidor débil del CYP2D6.",
        "En pacientes donde se prioriza la flexibilidad posológica: permitiendo concentrar la mayor parte de la dosis al anochecer para optimizar la tolerancia."] },
  { q: "Si utiliza Clobazam para el tratamiento a corto plazo de los trastornos de ansiedad, ¿en qué contexto clínico considera más oportuna su prescripción?",
    o: ["Como tratamiento inicial: en pacientes que presentan simultáneamente cuadros de ansiedad y crisis epilépticas, aprovechando su acción dual ansiolítica y anticonvulsivante.",
        "Como terapia adjunta al esquema antiepiléptico: cuando el paciente ya en tratamiento con FAE presenta síntomas de ansiedad comórbida que interfieren con su estabilidad clínica.",
        "Durante periodos de transición o ajuste de dosis de otros FAE: para mitigar la ansiedad reactiva o trastornos del sueño asociados a la titulación de la medicación de base.",
        "No indico Clobazam para la ansiedad: reservando su uso exclusivamente para el tratamiento coadyuvante de la epilepsia."] },
  { q: "Aunque la indicación principal de Clobazam destaca su uso en crisis parciales, ¿en qué escenarios de crisis generalizadas consideraría usted su incorporación como terapia coadyuvante según su experiencia clínica?",
    o: ["En crisis tónico-clónicas generalizadas refractarias: cuando los fármacos antiepilépticos (FAE) de primera línea no logran el control total de las convulsiones.",
        "En crisis motoras específicas (tónicas, atónicas o mioclónicas): especialmente en pacientes que persisten con estos eventos a pesar de un esquema basal optimizado.",
        "En síndromes epilépticos complejos de difícil control: como el síndrome de Lennox-Gastaut o ausencias atípicas, ajustando la dosis según la respuesta individual.",
        "Limito su uso estrictamente a crisis parciales: con o sin generalización secundaria."] },
  { q: "El metabolito activo de Clobazam (N-desmetilclobazam) tiene una vida media estimada en 79 horas. ¿Qué relevancia le otorga a este perfil farmacocinético?",
    o: ["Alta: asegura niveles plasmáticos estables una vez alcanzado el estado estacionario (en aproximadamente 2 semanas), lo que brinda protección ante fluctuaciones o eventuales olvidos de dosis.",
        "Media: facilita la adherencia al permitir que la dosis más alta (o hasta 30 mg) sea administrada en una única toma nocturna.",
        "Requiere precaución: debido al riesgo de acumulación excesiva, especialmente en metabolizadores lentos del CYP2C19 donde las concentraciones de N-desmetilclobazam pueden ser 5 veces mayores.",
        "Complica la discontinuación: considero que la persistencia prolongada del fármaco en el organismo exige un esquema de retiro aún más gradual para evitar el síndrome de abstinencia."] },
  { q: "Al definir el esquema de Clobazam, ¿cuál es su preferencia de titulación para alcanzar el objetivo terapéutico?",
    o: ["Inicio con la dosis mínima efectiva e incremento gradual hasta alcanzar la respuesta clínica deseada, siguiendo el principio de mantener la dosis tan baja como sea posible.",
        "Inicio con la dosis más alta tolerable según el perfil del paciente para lograr un control de síntomas rápido desde el comienzo del tratamiento.",
        "Si el paciente no presenta mejoría con dosis bajas iniciales, opto por no seguir titulando y considerar la rotación a otra alternativa terapéutica.",
        "Ajusto la velocidad de titulación basándome estrictamente en la tolerancia, deteniendo el aumento ante la aparición de efectos adversos como sedación o debilidad muscular."] },
  { q: "En su práctica con pacientes epilépticos bajo tratamiento crónico con Clobazam, ¿cuál es su conducta habitual respecto al retiro del fármaco?",
    o: ["Mantenimiento prolongado: lo considero una herramienta de base permanente mientras persista el beneficio clínico, asumiendo el riesgo de tolerancia.",
        "Retiro programado tras estabilidad: inicio una reducción gradual y supervisada únicamente si el paciente permanece libre de crisis por un periodo prolongado.",
        "Limitación por riesgo de dependencia: intento utilizarlo por ciclos definidos para evitar la desensibilización de receptores y la dependencia física.",
        "Evaluación estricta por protocolo: realizo reevaluaciones obligatorias cada 4 semanas para decidir activamente la continuidad o el retiro según el prospecto."] },
  { q: "Tras meses de buen control, su paciente presenta un aumento en la frecuencia de crisis. ¿Cómo considera más adecuado proceder?",
    o: ["Considero adecuado realizar un incremento puntual de la dosis: buscando recuperar el control clínico dentro de los rangos terapéuticos permitidos.",
        "Considero preferible realizar un \"lavado\" o retiro temporal: para luego reintroducir la molécula y recuperar la sensibilidad al fármaco.",
        "Considero que la aparición de tolerancia indica la necesidad de rotar el fármaco: buscando otra medicación con un mecanismo de acción diferente.",
        "Considero que el ajuste de la medicación de base (no benzodiacepínica) es la mejor opción: antes de modificar la dosis de clobazam."] },
  { q: "En comparación con las 1,4-benzodiacepinas (diazepam/clonazepam), ¿cómo valora el perfil de seguridad de clobazam respecto a la sedación diurna?",
    o: ["Considero que su estructura de 1,5-benzodiacepina ofrece una ventaja superior: al presentar significativamente menos efectos sedantes e impacto cognitivo.",
        "Considero que el perfil de sedación es similar al de otras benzodiacepinas: requiriendo las mismas precauciones en el manejo de maquinaria o conducción.",
        "Considero que la sedación es mínima si se administra la dosis principal al acostarse: aprovechando su pico plasmático durante el sueño.",
        "Considero que el impacto cognitivo es la principal barrera de uso."] }
];
const LETRAS = "ABCDE";
const respuestas = new Array(PREGUNTAS.length).fill(null);
let actual = 0;
let volverAResumen = false;

const $ = id => document.getElementById(id);

function pintarProgreso() {
  const hechas = respuestas.filter(r => r !== null).length;
  $("bar").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("count").textContent = hechas + " de " + PREGUNTAS.length + " respondidas";
}

function mostrarPregunta(i) {
  actual = i;
  const p = PREGUNTAS[i];
  $("tema").textContent = TEMA_ENCUESTA;
  $("quiz").classList.remove("hidden");
  $("summary").classList.add("hidden");
  $("qnum").textContent = "Pregunta " + (i + 1);
  $("qtext").textContent = p.q;
  const cont = $("opts");
  cont.innerHTML = "";
  p.o.forEach((texto, j) => {
    const b = document.createElement("button");
    b.className = "opt" + (respuestas[i] === j ? " sel" : "");
    b.innerHTML = '<span class="letter">' + LETRAS[j] + '</span><span></span>';
    b.lastChild.textContent = texto;
    b.onclick = () => elegir(j);
    cont.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = volverAResumen ? "Volver al resumen" : (i === PREGUNTAS.length - 1 ? "Ver resumen" : "Siguiente");
  pintarProgreso();
  window.scrollTo(0, 0);
}

function elegir(j) {
  respuestas[actual] = j;
  [...$("opts").children].forEach((el, k) => el.classList.toggle("sel", k === j));
  pintarProgreso();
  setTimeout(avanzar, 450);
}

function avanzar() {
  if (volverAResumen || actual === PREGUNTAS.length - 1) { mostrarResumen(); return; }
  mostrarPregunta(actual + 1);
}

function mostrarResumen() {
  volverAResumen = true;
  $("quiz").classList.add("hidden");
  $("summary").classList.remove("hidden");
  const rows = $("rows");
  rows.innerHTML = "";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    const b = document.createElement("button");
    b.className = "row" + (r === null ? " missing" : "");
    const num = document.createElement("b");
    num.textContent = (i + 1) + ".";
    const ans = document.createElement("span");
    ans.className = "ans";
    ans.textContent = r === null ? "Falta responder" : LETRAS[r] + ") " + p.o[r];
    const ch = document.createElement("span");
    ch.className = "change";
    ch.textContent = r === null ? "Tocá para responder" : "Tocá para cambiar";
    ans.appendChild(ch);
    b.append(num, ans);
    b.onclick = () => mostrarPregunta(i);
    rows.appendChild(b);
  });
  pintarProgreso();
  actualizarLinkEnvio();
  window.scrollTo(0, 0);
}

function actualizarLinkEnvio() {
  const base = WHATSAPP_NUMERO ? "https://wa.me/" + WHATSAPP_NUMERO : "https://wa.me/";
  const url = base + "?text=" + encodeURIComponent(armarMensaje());
  $("send").href = url;
  const fb = $("fallback");
  fb.innerHTML = "";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = "¿No pasó nada? Tocá acá";
  a.style.color = "var(--muted)";
  fb.appendChild(a);
}

function armarMensaje() {
  let txt = "Respuestas encuesta " + TEMA_ENCUESTA + ":\n\n";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    txt += (i + 1) + ") " + (r === null ? "SIN RESPONDER" : LETRAS[r] + " - " + p.o[r]) + "\n\n";
  });
  return txt.trim();
}

function faltantes() { return respuestas.filter(r => r === null).length; }

$("prev").onclick = () => { if (actual > 0) mostrarPregunta(actual - 1); };
$("next").onclick = avanzar;

$("send").addEventListener("click", (ev) => {
  const f = faltantes();
  if (f > 0 && !confirm("Faltan " + f + " respuesta(s). ¿Enviar igual?")) { ev.preventDefault(); return; }
  // el href ya está armado por actualizarLinkEnvio(); el navegador sigue el link de forma nativa
});

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(armarMensaje());
    $("toast").textContent = "Respuestas copiadas";
  } catch (e) {
    $("toast").textContent = "No se pudo copiar. Usá el botón verde.";
  }
};

mostrarPregunta(0);
</script>
</body>
</html>
