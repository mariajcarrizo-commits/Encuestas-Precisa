<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta PRECISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #16263B;
    --muted: #55657A;
    --line: #CBD4DF;
    --brand: #1F4E79;
    --pick: #1F7A5C;
    --pick-soft: #E3F3EC;
    --wa: #1E8E4E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
      --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
    --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
  header .tema { font-size: .85rem; margin: 2px 0 0; color: var(--muted); }
  header .titulos { display: flex; flex-direction: column; }
  .count { font-size: 1rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin: 12px 0 26px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .qnum { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--brand); margin: 0 0 10px; }
  .qtext { font-size: 1.3rem; font-weight: 700; margin: 0 0 22px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; font: inherit; font-size: 1.05rem; cursor: pointer; min-height: 64px;
  }
  .opt .letter {
    flex: 0 0 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; color: var(--muted);
  }
  .opt.sel { border-color: var(--pick); background: var(--pick-soft); }
  .opt.sel .letter { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700; padding: 14px 20px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #0F1722; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1722; } }
  .summary h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .summary p.lead { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; gap: 14px; background: var(--surface); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  }
  .row b { color: var(--brand); flex: 0 0 auto; font-size: 1.2rem; }
  .row .ans { font-size: 1rem; }
  .row .change { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .row.missing { border-color: #C0392B; }
  .send {
    display: block; width: 100%; margin-top: 18px; padding: 20px; font: inherit; font-size: 1.25rem;
    font-weight: 700; border: 0; border-radius: 14px; background: var(--wa); color: #fff; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .copy { display: block; width: 100%; margin-top: 10px; }
  .toast { text-align: center; color: var(--pick); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titulos">
      <h1>Encuesta PRECISA</h1>
      <p class="tema" id="tema"></p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main id="quiz">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Siguiente</button>
    </div>
  </main>

  <section class="summary hidden" id="summary">
    <h2>Listo, revisá tus respuestas</h2>
    <p class="lead">Tocá una respuesta si querés cambiarla. Después tocá el botón verde.</p>
    <div id="rows"></div>
    <a class="send" id="send" href="#" target="_top" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn copy" id="copy">Copiar respuestas</button>
    <p id="fallback" style="text-align:center; margin-top:14px;"></p>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script>
// Número de WhatsApp de destino (con código de país, sin + ni espacios, ej: 5491112345678).
// Si queda vacío, WhatsApp le pide elegir el contacto.
const WHATSAPP_NUMERO = "5491166478496";

// Tema de la encuesta actual: esta es la ÚNICA línea que hay que cambiar
// cada vez que llega una encuesta nueva. Va entre comillas.
const TEMA_ENCUESTA = "Epilepsia 2";

const PREGUNTAS = [
  { q: "¿Cuál de las siguientes opciones describe mejor su práctica clínica en el manejo de pacientes con epilepsia?",
    o: ["Atiendo principalmente pacientes adultos en el ámbito de la Neurología general.",
        "Atiendo principalmente pacientes adultos con epilepsias focales refractarias y politerapia compleja.",
        "Mi práctica está enfocada en la Neurología Pediátrica y el manejo de epilepsias del desarrollo.",
        "Atiendo pacientes de todas las edades, con foco en el control de crisis y calidad de vida.",
        "No suelo atender pacientes con epilepsia."] },
  { q: "En promedio, ¿cuántos pacientes con epilepsia bajo tratamiento con fármacos antiepilépticos (FAE) evalúa mensualmente?",
    o: ["Más de 20 pacientes por mes.",
        "Entre 10 y 20 pacientes por mes.",
        "Entre 5 y 10 pacientes por mes.",
        "Menos de 5 pacientes por mes."] },
  { q: "Usted atiende a un paciente pediátrico con diagnóstico de SLG que continúa con crisis frecuentes a pesar de un tratamiento optimizado con valproato. Ante la necesidad de mejorar el control, ¿cuál considera que es la conducta más adecuada?",
    o: ["Mantener el valproato y sumar rufinamida: buscando el efecto específico sobre las crisis de caída con un fármaco indicado formalmente como terapia adjunta para SLG.",
        "Mantener el valproato y sumar levetiracetam: priorizando un tratamiento concomitante de amplio espectro, indicado a partir de un mes de edad para crisis de inicio parcial.",
        "Mantener el valproato y sumar clobazam: optando por la biterapia clásica para intentar el control de crisis en el contexto del SLG.",
        "Cambiar por otra monoterapia antes de utilizar un tratamiento combinado: intentando el control con un único fármaco antes de escalar a un esquema de politerapia."] },
  { q: "Considerando que tanto la rufinamida (suspensión al 4%) como el levetiracetam (solución al 10%) cuentan con presentaciones líquidas, ¿cuál considera que es el beneficio más relevante de estas formulaciones frente a los comprimidos sólidos en el manejo de pacientes con epilepsia refractaria o de difícil control?",
    o: ["Precisión en la titulación inicial: permitiendo mediciones exactas en ml y ajustes milimétricos para mejorar la tolerabilidad y optimizar la respuesta clínica desde el inicio del tratamiento.",
        "Facilidad en poblaciones con necesidades especiales: siendo la opción ideal para pacientes pediátricos, ancianos con disfagia o aquellos que requieren administración por sonda enteral.",
        "Rapidez y optimización de la absorción: valorando que las presentaciones líquidas favorecen una absorción más predecible y facilitan la toma con alimentos.",
        "Mejora en la adherencia terapéutica: facilitando la toma en pacientes con politerapia compleja que presentan rechazo a las formas sólidas o requieren una administración más cómoda."] },
  { q: "Tras la incorporación de rufinamida o levetiracetam como tratamiento coadyuvante, ¿cuál es su criterio respecto al tiempo necesario para observar un efecto anticonvulsivante clínicamente tangible?",
    o: ["Observación temprana: considero que la disminución de las crisis debe observarse desde los primeros días de tratamiento (al alcanzar la dosis inicial efectiva), aunque estas no remitan por completo.",
        "Evaluación de estabilización inicial: considero que se requiere un periodo de al menos 2 semanas para evaluar adecuadamente el impacto tras alcanzar el estado estacionario de la molécula.",
        "Evaluación de mediano plazo: considero que se requieren más de 4 semanas para evaluar la respuesta clínica real, permitiendo una titulación progresiva y una adaptación del paciente.",
        "Dependencia de la dosis objetivo: considero que la respuesta terapéutica sólo es evaluable luego de transcurridas varias semanas con el paciente mantenido en la dosis objetivo definida según su peso.",
        "Variabilidad clínica: considero que el tiempo de respuesta es altamente variable y depende estrictamente de la semiología de las crisis (ej. crisis de caída en SLG vs. crisis parciales)."] },
  { q: "Respecto a la fase de escalada al incorporar un nuevo tratamiento coadyuvante, ¿cuál es su filosofía habitual para alcanzar la dosis objetivo en pacientes con epilepsia de difícil control?",
    o: ["Considero adecuado seguir el esquema de incrementos sugerido en el prospecto de cada molécula: realizando los ajustes en los tiempos estipulados (ya sean días o semanas) para alcanzar la dosis terapéutica de mantenimiento de forma estandarizada.",
        "Considero preferible realizar una titulación más lenta y progresiva que la sugerida: extendiendo los intervalos entre aumentos para maximizar la tolerancia y minimizar el riesgo de efectos adversos (conductuales, somnolencia o digestivos).",
        "Considero necesario realizar una escalada rápida hacia la dosis máxima recomendada: especialmente en pacientes críticos, buscando alcanzar la estabilidad clínica y el control de crisis en el menor tiempo posible.",
        "Considero que la titulación no debe tener tiempos predefinidos: evaluando los incrementos de dosis basándome estrictamente en la respuesta clínica individual y la tolerancia observada en cada visita."] },
  { q: "En pacientes de un año de edad o mayores con crisis asociadas al Síndrome de Lennox-Gastaut (SLG), ¿cuándo considera la incorporación de Rufinamida como terapia coadyuvante?",
    o: ["Ante el fracaso de la primera línea de fármacos antiepilépticos (FAE): buscando un mecanismo de acción complementario a través de la modulación de canales de sodio.",
        "En pacientes polimedicados: debido a su bajo riesgo de interacciones por desplazamiento de proteínas plasmáticas (unión del 34%).",
        "En esquemas terapéuticos con alta carga metabólica: aprovechando que su eliminación es casi exclusiva por hidrólisis y no depende significativamente del sistema citocromo P450.",
        "Reservado para casos de refractariedad extrema: tras haber agotado múltiples opciones terapéuticas previas."] },
  { q: "En su experiencia clínica, ¿en qué perfil de paciente considera que Levetiracetam aporta el mayor valor terapéutico como primera elección?",
    o: ["Monoterapia en adultos y adolescentes (>16 años): con diagnóstico reciente de epilepsia (crisis de inicio parcial).",
        "Terapia concomitante en crisis de inicio parcial con o sin generalización secundaria: desde lactantes (1 mes de vida) hasta adultos.",
        "Pacientes con crisis generalizadas (mioclónicas o tónico-clónicas primarias): dentro de un esquema de tratamiento adyuvante.",
        "Pacientes con politerapia compleja: donde es crítico evitar interacciones mediadas por el sistema citocromo P450."] },
  { q: "Ante un paciente pediátrico con Síndrome de Lennox-Gastaut que presenta \"crisis de caída\" (atónicas/tónicas) frecuentes con riesgo de traumatismo, ¿qué fármaco elegiría para sumar al esquema basal?",
    o: ["Topiramato.",
        "Rufinamida.",
        "Zonisamida.",
        "Clobazam."] },
  { q: "Ante una paciente mujer de 24 años con diagnóstico reciente de crisis focales. Utiliza anticonceptivos orales y planea un embarazo en el corto plazo. ¿Qué fármaco elegiría como primera línea considerando eficacia y seguridad reproductiva?",
    o: ["Lamotrigina.",
        "Lacosamida.",
        "Levetiracetam.",
        "Oxcarbazepina."] }
];
const LETRAS = "ABCDE";
const respuestas = new Array(PREGUNTAS.length).fill(null);
let actual = 0;
let volverAResumen = false;

const $ = id => document.getElementById(id);

function pintarProgreso() {
  const hechas = respuestas.filter(r => r !== null).length;
  $("bar").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("count").textContent = hechas + " de " + PREGUNTAS.length + " respondidas";
}

function mostrarPregunta(i) {
  actual = i;
  const p = PREGUNTAS[i];
  $("tema").textContent = TEMA_ENCUESTA;
  $("quiz").classList.remove("hidden");
  $("summary").classList.add("hidden");
  $("qnum").textContent = "Pregunta " + (i + 1);
  $("qtext").textContent = p.q;
  const cont = $("opts");
  cont.innerHTML = "";
  p.o.forEach((texto, j) => {
    const b = document.createElement("button");
    b.className = "opt" + (respuestas[i] === j ? " sel" : "");
    b.innerHTML = '<span class="letter">' + LETRAS[j] + '</span><span></span>';
    b.lastChild.textContent = texto;
    b.onclick = () => elegir(j);
    cont.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = volverAResumen ? "Volver al resumen" : (i === PREGUNTAS.length - 1 ? "Ver resumen" : "Siguiente");
  pintarProgreso();
  window.scrollTo(0, 0);
}

function elegir(j) {
  respuestas[actual] = j;
  [...$("opts").children].forEach((el, k) => el.classList.toggle("sel", k === j));
  pintarProgreso();
  setTimeout(avanzar, 450);
}

function avanzar() {
  if (volverAResumen || actual === PREGUNTAS.length - 1) { mostrarResumen(); return; }
  mostrarPregunta(actual + 1);
}

function mostrarResumen() {
  volverAResumen = true;
  $("quiz").classList.add("hidden");
  $("summary").classList.remove("hidden");
  const rows = $("rows");
  rows.innerHTML = "";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    const b = document.createElement("button");
    b.className = "row" + (r === null ? " missing" : "");
    const num = document.createElement("b");
    num.textContent = (i + 1) + ".";
    const ans = document.createElement("span");
    ans.className = "ans";
    ans.textContent = r === null ? "Falta responder" : LETRAS[r] + ") " + p.o[r];
    const ch = document.createElement("span");
    ch.className = "change";
    ch.textContent = r === null ? "Tocá para responder" : "Tocá para cambiar";
    ans.appendChild(ch);
    b.append(num, ans);
    b.onclick = () => mostrarPregunta(i);
    rows.appendChild(b);
  });
  pintarProgreso();
  actualizarLinkEnvio();
  window.scrollTo(0, 0);
}

function actualizarLinkEnvio() {
  const base = WHATSAPP_NUMERO ? "https://wa.me/" + WHATSAPP_NUMERO : "https://wa.me/";
  const url = base + "?text=" + encodeURIComponent(armarMensaje());
  $("send").href = url;
  const fb = $("fallback");
  fb.innerHTML = "";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = "¿No pasó nada? Tocá acá";
  a.style.color = "var(--muted)";
  fb.appendChild(a);
}

function armarMensaje() {
  let txt = "Respuestas encuesta " + TEMA_ENCUESTA + ":\n\n";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    txt += (i + 1) + ") " + (r === null ? "SIN RESPONDER" : LETRAS[r] + " - " + p.o[r]) + "\n\n";
  });
  return txt.trim();
}

function faltantes() { return respuestas.filter(r => r === null).length; }

$("prev").onclick = () => { if (actual > 0) mostrarPregunta(actual - 1); };
$("next").onclick = avanzar;

$("send").addEventListener("click", (ev) => {
  const f = faltantes();
  if (f > 0 && !confirm("Faltan " + f + " respuesta(s). ¿Enviar igual?")) { ev.preventDefault(); return; }
  // el href ya está armado por actualizarLinkEnvio(); el navegador sigue el link de forma nativa
});

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(armarMensaje());
    $("toast").textContent = "Respuestas copiadas";
  } catch (e) {
    $("toast").textContent = "No se pudo copiar. Usá el botón verde.";
  }
};

mostrarPregunta(0);
</script>
</body>
</html>
