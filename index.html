<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta PRECISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #16263B;
    --muted: #55657A;
    --line: #CBD4DF;
    --brand: #1F4E79;
    --pick: #1F7A5C;
    --pick-soft: #E3F3EC;
    --wa: #1E8E4E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
      --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
    --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
  header .tema { font-size: .85rem; margin: 2px 0 0; color: var(--muted); }
  header .titulos { display: flex; flex-direction: column; }
  .count { font-size: 1rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin: 12px 0 26px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .qnum { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--brand); margin: 0 0 10px; }
  .qtext { font-size: 1.3rem; font-weight: 700; margin: 0 0 22px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; font: inherit; font-size: 1.05rem; cursor: pointer; min-height: 64px;
  }
  .opt .letter {
    flex: 0 0 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; color: var(--muted);
  }
  .opt.sel { border-color: var(--pick); background: var(--pick-soft); }
  .opt.sel .letter { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700; padding: 14px 20px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #0F1722; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1722; } }
  .summary h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .summary p.lead { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; gap: 14px; background: var(--surface); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  }
  .row b { color: var(--brand); flex: 0 0 auto; font-size: 1.2rem; }
  .row .ans { font-size: 1rem; }
  .row .change { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .row.missing { border-color: #C0392B; }
  .send {
    display: block; width: 100%; margin-top: 18px; padding: 20px; font: inherit; font-size: 1.25rem;
    font-weight: 700; border: 0; border-radius: 14px; background: var(--wa); color: #fff; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .copy { display: block; width: 100%; margin-top: 10px; }
  .toast { text-align: center; color: var(--pick); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titulos">
      <h1>Encuesta PRECISA</h1>
      <p class="tema" id="tema"></p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main id="quiz">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Siguiente</button>
    </div>
  </main>

  <section class="summary hidden" id="summary">
    <h2>Listo, revisá tus respuestas</h2>
    <p class="lead">Tocá una respuesta si querés cambiarla. Después tocá el botón verde.</p>
    <div id="rows"></div>
    <a class="send" id="send" href="#" target="_top" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn copy" id="copy">Copiar respuestas</button>
    <p id="fallback" style="text-align:center; margin-top:14px;"></p>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script>
// Número de WhatsApp de destino (con código de país, sin + ni espacios, ej: 5491112345678).
// Si queda vacío, WhatsApp le pide elegir el contacto.
const WHATSAPP_NUMERO = "5491166478496";

// Tema de la encuesta actual: esta es la ÚNICA línea que hay que cambiar
// cada vez que llega una encuesta nueva. Va entre comillas.
const TEMA_ENCUESTA = "Demencia";

const PREGUNTAS = [
  { q: "¿Cuál de las siguientes opciones describe mejor su enfoque principal en el manejo de pacientes con Enfermedad de Parkinson (EP)?",
    o: ["Mi práctica está centrada en la Neurología, con foco en trastornos del movimiento y control motor.",
        "Mi enfoque es la Psiquiatría o Neuropsiquiatría, tratando las complicaciones conductuales de la EP.",
        "Atiendo principalmente pacientes geriátricos, manejando de forma integral la EP y sus comorbilidades.",
        "Mi práctica es de medicina general o interna, realizando el seguimiento de pacientes con EP estable.",
        "No suelo atender pacientes con EP ni sus complicaciones."] },
  { q: "En promedio, ¿cuántos pacientes con síntomas psicóticos asociados a la Enfermedad de Parkinson (PEP) evalúa mensualmente?",
    o: ["Más de 10 pacientes por mes.",
        "Entre 5 y 10 pacientes por mes.",
        "Menos de 5 pacientes por mes.",
        "Mi práctica actual no suele recibir estos casos de forma regular."] },
  { q: "Usted atiende a un paciente con Parkinson avanzado que comienza con alucinaciones visuales que impactan en su calidad de vida. ¿En qué momento considera la incorporación de pimavanserina?",
    o: ["Considero que es la primera opción terapéutica: por su indicación específica para la psicosis en Parkinson y su perfil de seguridad motora.",
        "Considero su inicio tras la reducción de la medicación dopaminérgica: buscando controlar los síntomas psicóticos antes de recurrir a antipsicóticos típicos o atípicos.",
        "Considero su uso solo en casos refractarios: tras el fracaso de dosis bajas de otros antipsicóticos como quetiapina.",
        "Considero que su uso depende de la severidad del cuadro: reservándolo para pacientes con síntomas psicóticos persistentes y disruptivos."] },
  { q: "El paciente y su familia temen que el tratamiento para las alucinaciones empeore el temblor o la rigidez. ¿Cómo valora usted el mecanismo de acción de la pimavanserina en este contexto?",
    o: ["Considero fundamental su neutralidad sobre el receptor D2: ya que es la única garantía real de que el control de la psicosis no anulará el efecto de la levodopa u otros dopaminérgicos.",
        "Considero que el abordaje exclusivo de la vía 5-HT2A es el mayor avance: porque permite tratar los síntomas neuropsiquiátricos desde un sistema (serotoninérgico) independiente del motor.",
        "Considero que su perfil de seguridad motora es superior al de los antipsicóticos atípicos: al evitar el bloqueo dopaminérgico que induce parkinsonismo secundario.",
        "Considero que su perfil de seguridad motora es comparable a dosis bajas de quetiapina: evaluando la respuesta individual de cada paciente."] },
  { q: "Pimavanserina se administra en una dosis de 34 mg una vez al día y no requiere titulación inicial. ¿Cuál es su percepción sobre este esquema posológico?",
    o: ["Considero que es sumamente importante para asegurar la adherencia: ya que simplifica significativamente un régimen terapéutico que suele ser muy complejo y estar polimedicado en el paciente con Parkinson.",
        "Considero que es una característica útil, aunque secundaria: valorando que la simplicidad es positiva, pero siempre supeditada al perfil de seguridad motora y la eficacia sobre los síntomas psicóticos.",
        "Considero que es un aspecto que no influye significativamente en mi decisión: priorizando el beneficio terapéutico global y la resolución de las alucinaciones por sobre la facilidad de la administración única diaria.",
        "Considero que es un aspecto negativo, ya que prefiero ajustar la dosis progresivamente: optando por una titulación inicial (escalada) que permita monitorear la respuesta individual y la tolerancia del paciente paso a paso."] },
  { q: "La pimavanserina tiene el potencial de prolongar el intervalo QTc, por lo que debe evaluarse con cautela en pacientes con enfermedades cardíacas conocidas o que consumen fármacos que afecten este intervalo. ¿Cómo gestiona usted esta advertencia en su práctica?",
    o: ["Considero indispensable realizar un ECG basal previo al inicio: para documentar el estado del intervalo QTc y descartar arritmias antes de prescribir la dosis de 34 mg.",
        "Considero que el riesgo es manejable mediante la evaluación de la historia clínica: analizando los antecedentes cardiovasculares y revisando la lista de fármacos concomitantes sin necesidad de estudios basales de rutina.",
        "Considero prioritario evitar la combinación con fármacos específicos: enfocándome en no coadministrar con antiarrítmicos clase IA y III u otros fármacos que prolonguen el QTc.",
        "Considero que el riesgo de prolongación del QTc es una barrera importante para la prescripción: especialmente en la población añosa con Parkinson, lo que me hace ser más cauteloso al elegir esta molécula."] },
  { q: "Tras iniciar el tratamiento con Pimavanserina (34 mg/día), los familiares suelen consultar sobre el tiempo estimado para observar una mejoría en las alucinaciones o delirios. ¿Cuál es su criterio clínico respecto al tiempo necesario para evaluar un efecto tangible?",
    o: ["Considero que la respuesta clínica debe verse rápidamente: de lo contrario, prefiero retirar el fármaco para buscar otras alternativas terapéuticas.",
        "Considero que la mejoría debe observarse en el corto plazo (aprox. 4 semanas): valorando positivamente una respuesta progresiva que permita aliviar rápidamente la carga del cuidador y el distrés del paciente.",
        "Considero necesario aguardar al menos 6 semanas de tratamiento continuo: para evaluar el beneficio terapéutico pleno de la molécula, siguiendo los tiempos de respuesta observados en los estudios clínicos pivotales.",
        "Considero que la latencia de respuesta es un aspecto negativo: ya que el requerir varias semanas para alcanzar el efecto máximo puede comprometer la adherencia o la confianza de la familia en el tratamiento."] },
  { q: "Los pacientes con Parkinson avanzado suelen presentar somnolencia diurna, riesgo de caídas y fragilidad metabólica. ¿Cómo valora el perfil de la pimavanserina (ausencia de efecto sedante y de impacto en el peso/glucemia) frente a los antipsicóticos atípicos?",
    o: ["Considero que es un diferencial fundamental: para mantener la alerta del paciente durante el día y evitar complicaciones metabólicas, factores clave en la calidad de vida del paciente con Parkinson.",
        "Considero que es un beneficio valioso, aunque secundario: valorando positivamente la ausencia de estos efectos, siempre que se logre el control efectivo de las alucinaciones.",
        "Considero que el perfil es correcto, pero no influye significativamente en mi elección: priorizando mi experiencia previa con otras moléculas por sobre la ausencia de sedación.",
        "Considero que la sedación no es necesariamente un aspecto negativo: ya que en ciertos pacientes con agitación nocturna o insomnio, el efecto sedante de otros antipsicóticos puede resultarme de utilidad clínica."] },
  { q: "Ante un paciente de 75 años con EP de 10 años de evolución, con buen control motor con levodopa, pero que presenta alucinaciones visuales que le generan angustia. Presenta alto riesgo de caídas por inestabilidad postural. ¿Cuál sería su elección farmacológica inicial?",
    o: ["Risperidona.",
        "Quetiapina.",
        "Pimavanserina.",
        "Clozapina."] },
  { q: "Ante un paciente con EP y Psicosis, medicado con Levodopa y Quetiapina (50 mg/día). Presenta sedación diurna excesiva y tuvo dos caídas recientes, pero las alucinaciones persisten. ¿Cuál sería su conducta?",
    o: ["Rotar a aripiprazol.",
        "Rotar a pimavanserina.",
        "Aumentar la dosis de quetiapina.",
        "Agregar una dosis adicional de levodopa.",
        "Suspender todo tratamiento antipsicótico."] }
];
const LETRAS = "ABCDE";
const respuestas = new Array(PREGUNTAS.length).fill(null);
let actual = 0;
let volverAResumen = false;

const $ = id => document.getElementById(id);

function pintarProgreso() {
  const hechas = respuestas.filter(r => r !== null).length;
  $("bar").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("count").textContent = hechas + " de " + PREGUNTAS.length + " respondidas";
}

function mostrarPregunta(i) {
  actual = i;
  const p = PREGUNTAS[i];
  $("tema").textContent = TEMA_ENCUESTA;
  $("quiz").classList.remove("hidden");
  $("summary").classList.add("hidden");
  $("qnum").textContent = "Pregunta " + (i + 1);
  $("qtext").textContent = p.q;
  const cont = $("opts");
  cont.innerHTML = "";
  p.o.forEach((texto, j) => {
    const b = document.createElement("button");
    b.className = "opt" + (respuestas[i] === j ? " sel" : "");
    b.innerHTML = '<span class="letter">' + LETRAS[j] + '</span><span></span>';
    b.lastChild.textContent = texto;
    b.onclick = () => elegir(j);
    cont.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = volverAResumen ? "Volver al resumen" : (i === PREGUNTAS.length - 1 ? "Ver resumen" : "Siguiente");
  pintarProgreso();
  window.scrollTo(0, 0);
}

function elegir(j) {
  respuestas[actual] = j;
  [...$("opts").children].forEach((el, k) => el.classList.toggle("sel", k === j));
  pintarProgreso();
  setTimeout(avanzar, 450);
}

function avanzar() {
  if (volverAResumen || actual === PREGUNTAS.length - 1) { mostrarResumen(); return; }
  mostrarPregunta(actual + 1);
}

function mostrarResumen() {
  volverAResumen = true;
  $("quiz").classList.add("hidden");
  $("summary").classList.remove("hidden");
  const rows = $("rows");
  rows.innerHTML = "";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    const b = document.createElement("button");
    b.className = "row" + (r === null ? " missing" : "");
    const num = document.createElement("b");
    num.textContent = (i + 1) + ".";
    const ans = document.createElement("span");
    ans.className = "ans";
    ans.textContent = r === null ? "Falta responder" : LETRAS[r] + ") " + p.o[r];
    const ch = document.createElement("span");
    ch.className = "change";
    ch.textContent = r === null ? "Tocá para responder" : "Tocá para cambiar";
    ans.appendChild(ch);
    b.append(num, ans);
    b.onclick = () => mostrarPregunta(i);
    rows.appendChild(b);
  });
  pintarProgreso();
  actualizarLinkEnvio();
  window.scrollTo(0, 0);
}

function actualizarLinkEnvio() {
  const base = WHATSAPP_NUMERO ? "https://wa.me/" + WHATSAPP_NUMERO : "https://wa.me/";
  const url = base + "?text=" + encodeURIComponent(armarMensaje());
  $("send").href = url;
  const fb = $("fallback");
  fb.innerHTML = "";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = "¿No pasó nada? Tocá acá";
  a.style.color = "var(--muted)";
  fb.appendChild(a);
}

function armarMensaje() {
  let txt = "Respuestas encuesta " + TEMA_ENCUESTA + ":\n\n";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    txt += (i + 1) + ") " + (r === null ? "SIN RESPONDER" : LETRAS[r] + " - " + p.o[r]) + "\n\n";
  });
  return txt.trim();
}

function faltantes() { return respuestas.filter(r => r === null).length; }

$("prev").onclick = () => { if (actual > 0) mostrarPregunta(actual - 1); };
$("next").onclick = avanzar;

$("send").addEventListener("click", (ev) => {
  const f = faltantes();
  if (f > 0 && !confirm("Faltan " + f + " respuesta(s). ¿Enviar igual?")) { ev.preventDefault(); return; }
  // el href ya está armado por actualizarLinkEnvio(); el navegador sigue el link de forma nativa
});

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(armarMensaje());
    $("toast").textContent = "Respuestas copiadas";
  } catch (e) {
    $("toast").textContent = "No se pudo copiar. Usá el botón verde.";
  }
};

mostrarPregunta(0);
</script>
</body>
</html>
