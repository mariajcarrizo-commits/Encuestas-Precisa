<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta PRECISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #16263B;
    --muted: #55657A;
    --line: #CBD4DF;
    --brand: #1F4E79;
    --pick: #1F7A5C;
    --pick-soft: #E3F3EC;
    --wa: #1E8E4E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
      --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
    --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
  header .tema { font-size: .85rem; margin: 2px 0 0; color: var(--muted); }
  header .titulos { display: flex; flex-direction: column; }
  .count { font-size: 1rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin: 12px 0 26px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .qnum { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--brand); margin: 0 0 10px; }
  .qtext { font-size: 1.3rem; font-weight: 700; margin: 0 0 22px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; font: inherit; font-size: 1.05rem; cursor: pointer; min-height: 64px;
  }
  .opt .letter {
    flex: 0 0 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; color: var(--muted);
  }
  .opt.sel { border-color: var(--pick); background: var(--pick-soft); }
  .opt.sel .letter { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700; padding: 14px 20px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #0F1722; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1722; } }
  .summary h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .summary p.lead { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; gap: 14px; background: var(--surface); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  }
  .row b { color: var(--brand); flex: 0 0 auto; font-size: 1.2rem; }
  .row .ans { font-size: 1rem; }
  .row .change { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .row.missing { border-color: #C0392B; }
  .send {
    display: block; width: 100%; margin-top: 18px; padding: 20px; font: inherit; font-size: 1.25rem;
    font-weight: 700; border: 0; border-radius: 14px; background: var(--wa); color: #fff; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .copy { display: block; width: 100%; margin-top: 10px; }
  .toast { text-align: center; color: var(--pick); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titulos">
      <h1>Encuesta PRECISA</h1>
      <p class="tema" id="tema"></p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main id="quiz">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Siguiente</button>
    </div>
  </main>

  <section class="summary hidden" id="summary">
    <h2>Listo, revisá tus respuestas</h2>
    <p class="lead">Tocá una respuesta si querés cambiarla. Después tocá el botón verde.</p>
    <div id="rows"></div>
    <a class="send" id="send" href="#" target="_top" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn copy" id="copy">Copiar respuestas</button>
    <p id="fallback" style="text-align:center; margin-top:14px;"></p>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script>
// Número de WhatsApp de destino (con código de país, sin + ni espacios, ej: 5491112345678).
// Si queda vacío, WhatsApp le pide elegir el contacto.
const WHATSAPP_NUMERO = "5491166478496";

// Tema de la encuesta actual: esta es la ÚNICA línea que hay que cambiar
// cada vez que llega una encuesta nueva. Va entre comillas.
const TEMA_ENCUESTA = "Esquizofrenia Bipolar";

const PREGUNTAS = [
  { q: "¿Cuál de las siguientes opciones describe mejor su práctica clínica habitual?",
    o: ["Atiendo principalmente pacientes con trastornos del espectro de la Esquizofrenia.",
        "Mi enfoque principal es el manejo de Trastornos del Ánimo (Trastorno Bipolar y Depresión).",
        "Atiendo de manera equitativa pacientes con Esquizofrenia y Trastorno Bipolar.",
        "Mi práctica es de psiquiatría general y recibo estos casos de forma esporádica."] },
  { q: "En promedio, ¿cuántos pacientes con diagnóstico de Esquizofrenia o Trastorno Bipolar bajo tratamiento con antipsicóticos evalúa mensualmente?",
    o: ["Más de 20 pacientes por mes.",
        "Entre 10 y 20 pacientes por mes.",
        "Entre 5 y 10 pacientes por mes.",
        "Menos de 5 pacientes por mes."] },
  { q: "Considerando que la evidencia clínica de los estudios pivotales indica que la Lumateperona alcanza su eficacia con una dosis estándar de 42 mg desde el primer día, sin necesidad de titulación, ¿cuál es su predisposición a comenzar el tratamiento con la dosis de 42 mg desde el inicio?",
    o: ["Seguiría la indicación del prospecto: iniciaría con 42 mg para asegurar que el paciente entre en ventana terapéutica rápidamente.",
        "Inicio gradual: iniciaría con dosis más bajas y aumentaría paulatinamente hasta alcanzar los 42 mg, buscando minimizar efectos adversos.",
        "Evaluación de efectividad mínima: iniciaría dosis bajas y mantendría esa dosis esperando ver algún signo de mejoría antes de aumentar.",
        "Solo iniciaría con 42 mg en pacientes graves; en cuadros leves/moderados optaría por una titulación lenta."] },
  { q: "Ante la dificultad de adherencia en patologías crónicas, ¿cómo valora una posología de una sola cápsula al día, sin necesidad de titulación ni requerimientos de ingesta calórica específica?",
    o: ["Muy valiosa: reduce significativamente el riesgo de errores en la dosificación y facilita la vida del paciente.",
        "Valiosa: especialmente la independencia de la ingesta de alimentos para asegurar la absorción.",
        "Poco relevante: mis pacientes están acostumbrados a esquemas de titulación gradual.",
        "Prefiero tener múltiples presentaciones de dosis para ajustar según la respuesta clínica de cada paciente."] },
  { q: "En el abordaje de la Esquizofrenia, ¿cuál de los siguientes perfiles de pacientes considera que se beneficiaría más del inicio de un tratamiento con eficacia probada y una incidencia de aumento de peso y síntomas extrapiramidales similar al placebo?",
    o: ["Paciente naïve (primer episodio): para establecer un estándar de alta tolerabilidad y asegurar la adherencia desde el inicio del tratamiento.",
        "Rotación estratégica (switch): en pacientes con respuesta clínica estable pero que presentan aumento de peso significativo o acatisia con su esquema actual.",
        "Optimización de síntomas residuales: en pacientes que requieren una opción con menor impacto motor para mejorar su desempeño funcional diario.",
        "Manejo de riesgo cardiometabólico: en pacientes adultos con obesidad, diabetes o dislipidemia preexistente donde se busca no agravar el cuadro metabólico."] },
  { q: "En el espectro de la Depresión Bipolar (I y II), ¿en qué situación clínica priorizaría el uso de una molécula que ofrece eficacia tanto en monoterapia como en terapia adjunta (con litio o valproato), manteniendo un perfil de tolerabilidad motor y metabólico favorable?",
    o: ["Monoterapia en Trastorno Bipolar II: como herramienta de primera elección para cubrir la necesidad de tratamientos aprobados específicamente para este subtipo.",
        "Potenciación en Trastorno Bipolar I: como tratamiento adjunto en pacientes que no logran la eutimia solo con estabilizadores del ánimo tradicionales.",
        "Pacientes con alta sensibilidad a efectos adversos: para evitar la aparición de hiperprolactinemia, disfunción sexual o aumento de peso asociado a otros antipsicóticos.",
        "Inicio en fase aguda depresiva: para lograr una reducción de los síntomas sin necesidad de una titulación prolongada de dosis."] },
  { q: "¿Qué importancia asigna a la neutralidad metabólica (peso, glucemia y lípidos) al seleccionar un antipsicótico para tratamientos a largo plazo?",
    o: ["Es mi prioridad absoluta para evitar comorbilidades cardiometabólicas y abandono del tratamiento.",
        "Es importante, pero estoy dispuesto a sacrificarla si la eficacia sobre los síntomas positivos es superior.",
        "Es un factor secundario que prefiero manejar con dieta, ejercicio o fármacos adjuntos (ej. metformina).",
        "Solo es relevante en pacientes que ya presentan alteraciones metabólicas de base."] },
  { q: "En su experiencia clínica, ¿cuál de los siguientes perfiles de efectos adversos representa la mayor barrera para la adherencia a largo plazo y la calidad de vida en pacientes tratados con antipsicóticos?",
    o: ["El aumento de peso y las alteraciones metabólicas (dislipemia, hiperglucemia), por su impacto en la salud física y la autoimagen.",
        "Los efectos extrapiramidales y la acatisia, incluso si se presentan de forma leve o subclínica.",
        "La sedación excesiva que interfiere con la funcionalidad diaria y el desempeño laboral/académico.",
        "La hiperprolactinemia y sus consecuencias asociadas (disfunción sexual, galactorrea o impacto en la salud ósea)."] },
  { q: "Ante un paciente con Trastorno Bipolar que cursa un episodio depresivo moderado a grave, ¿cuál de las siguientes moléculas elegiría como su primera opción terapéutica?",
    o: ["Quetiapina.",
        "Lurasidona.",
        "Lumateperona.",
        "Cariprazina.",
        "Litio o Valproato en monoterapia."] },
  { q: "Para el inicio de tratamiento en un paciente con Esquizofrenia, donde el objetivo primordial es asegurar la adherencia evitando el aumento de peso y los síntomas extrapiramidales, ¿qué molécula seleccionaría?",
    o: ["Risperidona.",
        "Olanzapina.",
        "Quetiapina.",
        "Lumateperona.",
        "Aripiprazol."] }
];

const LETRAS = "ABCDE";
const respuestas = new Array(PREGUNTAS.length).fill(null);
let actual = 0;
let volverAResumen = false;

const $ = id => document.getElementById(id);

function pintarProgreso() {
  const hechas = respuestas.filter(r => r !== null).length;
  $("bar").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("count").textContent = hechas + " de " + PREGUNTAS.length + " respondidas";
}

function mostrarPregunta(i) {
  actual = i;
  const p = PREGUNTAS[i];
  $("tema").textContent = TEMA_ENCUESTA;
  $("quiz").classList.remove("hidden");
  $("summary").classList.add("hidden");
  $("qnum").textContent = "Pregunta " + (i + 1);
  $("qtext").textContent = p.q;
  const cont = $("opts");
  cont.innerHTML = "";
  p.o.forEach((texto, j) => {
    const b = document.createElement("button");
    b.className = "opt" + (respuestas[i] === j ? " sel" : "");
    b.innerHTML = '<span class="letter">' + LETRAS[j] + '</span><span></span>';
    b.lastChild.textContent = texto;
    b.onclick = () => elegir(j);
    cont.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = volverAResumen ? "Volver al resumen" : (i === PREGUNTAS.length - 1 ? "Ver resumen" : "Siguiente");
  pintarProgreso();
  window.scrollTo(0, 0);
}

function elegir(j) {
  respuestas[actual] = j;
  [...$("opts").children].forEach((el, k) => el.classList.toggle("sel", k === j));
  pintarProgreso();
  setTimeout(avanzar, 450);
}

function avanzar() {
  if (volverAResumen || actual === PREGUNTAS.length - 1) { mostrarResumen(); return; }
  mostrarPregunta(actual + 1);
}

function mostrarResumen() {
  volverAResumen = true;
  $("quiz").classList.add("hidden");
  $("summary").classList.remove("hidden");
  const rows = $("rows");
  rows.innerHTML = "";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    const b = document.createElement("button");
    b.className = "row" + (r === null ? " missing" : "");
    const num = document.createElement("b");
    num.textContent = (i + 1) + ".";
    const ans = document.createElement("span");
    ans.className = "ans";
    ans.textContent = r === null ? "Falta responder" : LETRAS[r] + ") " + p.o[r];
    const ch = document.createElement("span");
    ch.className = "change";
    ch.textContent = r === null ? "Tocá para responder" : "Tocá para cambiar";
    ans.appendChild(ch);
    b.append(num, ans);
    b.onclick = () => mostrarPregunta(i);
    rows.appendChild(b);
  });
  pintarProgreso();
  actualizarLinkEnvio();
  window.scrollTo(0, 0);
}

function actualizarLinkEnvio() {
  const base = WHATSAPP_NUMERO ? "https://wa.me/" + WHATSAPP_NUMERO : "https://wa.me/";
  const url = base + "?text=" + encodeURIComponent(armarMensaje());
  $("send").href = url;
  const fb = $("fallback");
  fb.innerHTML = "";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = "¿No pasó nada? Tocá acá";
  a.style.color = "var(--muted)";
  fb.appendChild(a);
}

function armarMensaje() {
  let txt = "Respuestas encuesta " + TEMA_ENCUESTA + ":\n\n";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    txt += (i + 1) + ") " + (r === null ? "SIN RESPONDER" : LETRAS[r] + " - " + p.o[r]) + "\n\n";
  });
  return txt.trim();
}

function faltantes() { return respuestas.filter(r => r === null).length; }

$("prev").onclick = () => { if (actual > 0) mostrarPregunta(actual - 1); };
$("next").onclick = avanzar;

$("send").addEventListener("click", (ev) => {
  const f = faltantes();
  if (f > 0 && !confirm("Faltan " + f + " respuesta(s). ¿Enviar igual?")) { ev.preventDefault(); return; }
  // el href ya está armado por actualizarLinkEnvio(); el navegador sigue el link de forma nativa
});

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(armarMensaje());
    $("toast").textContent = "Respuestas copiadas";
  } catch (e) {
    $("toast").textContent = "No se pudo copiar. Usá el botón verde.";
  }
};

mostrarPregunta(0);
</script>
</body>
</html>
