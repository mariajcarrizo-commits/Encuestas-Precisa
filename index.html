<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta PRECISA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #16263B;
    --muted: #55657A;
    --line: #CBD4DF;
    --brand: #1F4E79;
    --pick: #1F7A5C;
    --pick-soft: #E3F3EC;
    --wa: #1E8E4E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
      --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1722; --surface: #18222F; --ink: #EEF2F7; --muted: #A5B2C2;
    --line: #334255; --brand: #8DB8E6; --pick: #5BC69C; --pick-soft: #173529; --wa: #2FAE66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 18px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--brand); }
  header .tema { font-size: .85rem; margin: 2px 0 0; color: var(--muted); }
  header .titulos { display: flex; flex-direction: column; }
  .count { font-size: 1rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--line); border-radius: 8px; margin: 12px 0 26px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .qnum { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--brand); margin: 0 0 10px; }
  .qtext { font-size: 1.3rem; font-weight: 700; margin: 0 0 22px; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; font: inherit; font-size: 1.05rem; cursor: pointer; min-height: 64px;
  }
  .opt .letter {
    flex: 0 0 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; color: var(--muted);
  }
  .opt.sel { border-color: var(--pick); background: var(--pick-soft); }
  .opt.sel .letter { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700; padding: 14px 20px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #0F1722; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1722; } }
  .summary h2 { font-size: 1.6rem; margin: 0 0 6px; }
  .summary p.lead { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; gap: 14px; background: var(--surface); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%;
    text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  }
  .row b { color: var(--brand); flex: 0 0 auto; font-size: 1.2rem; }
  .row .ans { font-size: 1rem; }
  .row .change { display: block; color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .row.missing { border-color: #C0392B; }
  .send {
    display: block; width: 100%; margin-top: 18px; padding: 20px; font: inherit; font-size: 1.25rem;
    font-weight: 700; border: 0; border-radius: 14px; background: var(--wa); color: #fff; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
  }
  .copy { display: block; width: 100%; margin-top: 10px; }
  .toast { text-align: center; color: var(--pick); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titulos">
      <h1>Encuesta PRECISA</h1>
      <p class="tema" id="tema"></p>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main id="quiz">
    <p class="qnum" id="qnum"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <button class="btn primary" id="next">Siguiente</button>
    </div>
  </main>

  <section class="summary hidden" id="summary">
    <h2>Listo, revisá tus respuestas</h2>
    <p class="lead">Tocá una respuesta si querés cambiarla. Después tocá el botón verde.</p>
    <div id="rows"></div>
    <a class="send" id="send" href="#" target="_top" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn copy" id="copy">Copiar respuestas</button>
    <p id="fallback" style="text-align:center; margin-top:14px;"></p>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script>
// Número de WhatsApp de destino (con código de país, sin + ni espacios, ej: 5491112345678).
// Si queda vacío, WhatsApp le pide elegir el contacto.
const WHATSAPP_NUMERO = "5491166478496";

// Tema de la encuesta actual: esta es la ÚNICA línea que hay que cambiar
// cada vez que llega una encuesta nueva. Va entre comillas.
const TEMA_ENCUESTA = "IA - Relación Médico";

const PREGUNTAS = [
  { q: "¿Cómo reacciona cuando un paciente llega a la consulta con un \"pre-diagnóstico\" generado por una IA o un chatbot?",
    o: ["Lo integro en la conversación para corregir errores y educar.",
        "Lo ignoro para no perder tiempo de consulta.",
        "Me genera preocupación por la desinformación que pueda causar.",
        "Lo veo como una señal positiva de que el paciente se involucra en su salud."] },
  { q: "¿Ha utilizado alguna vez imágenes o esquemas generados por IA para explicarle a un paciente su patología o el mecanismo de acción de un fármaco?",
    o: ["Sí, facilita mucho la comprensión visual.",
        "No, pero utilizaría materiales validados si el laboratorio me los provee.",
        "No, prefiero los folletos o dibujos manuales tradicionales.",
        "No, me parece que puede confundir más al paciente."] },
  { q: "¿Qué herramienta de IA cree que ayudaría más a sus pacientes a cumplir con el tratamiento prescrito (adherencia)?",
    o: ["Chatbots de acompañamiento 24/7 para dudas sobre efectos adversos leves.",
        "Sistemas inteligentes de recordatorios personalizados según hábitos diarios.",
        "Apps que traduzcan el prospecto médico a un lenguaje sencillo y amigable.",
        "No creo que la IA pueda mejorar la adherencia."] },
  { q: "¿Estaría dispuesto a recomendar una App basada en IA para el monitoreo de síntomas entre consultas?",
    o: ["Sí, siempre que yo pueda supervisar los datos reportados.",
        "Solo si cuenta con el aval de una sociedad científica o ANMAT.",
        "No, prefiero que el paciente me contacte directamente por los canales habituales.",
        "Solo si la herramienta es provista por el laboratorio que fabrica el medicamento."] },
  { q: "¿Cuál es su mayor temor respecto al uso masivo de IA por parte de los pacientes?",
    o: ["El autodiagnóstico erróneo y el retraso en la consulta presencial.",
        "La automedicación basada en sugerencias de algoritmos.",
        "La pérdida de la autoridad y confianza en la relación médico-paciente.",
        "La filtración de datos sensibles de salud en plataformas no seguras."] },
  { q: "¿Cuál cree que será el impacto más disruptivo de la IA en la relación con sus pacientes en los próximos 2 años?",
    o: ["Pacientes mucho más informados (y potencialmente más críticos) sobre sus tratamientos.",
        "Una mayor personalización de las terapias gracias al procesamiento de datos del paciente en tiempo real.",
        "Una reducción de la carga administrativa, permitiendo que la consulta sea más \"humana\" y menos técnica.",
        "Un riesgo de deshumanización de la medicina si la tecnología reemplaza el diálogo clínico directo.",
        "Otro."] },
  { q: "En su opinión, ¿cómo afectará la integración de la IA a la \"calidad humana\" de su consulta a largo plazo?",
    o: ["Mejorará la calidad, ya que la IA se encargará de las tareas administrativas (historias clínicas, informes) dándome más tiempo para escuchar al paciente.",
        "La empeorará, porque la interacción con pantallas y dispositivos electrónicos durante la consulta creará una barrera mayor con el paciente.",
        "No habrá cambios significativos; la empatía depende exclusivamente de la personalidad del médico y no de las herramientas que use.",
        "Me preocupa que los pacientes prefieran la \"disponibilidad inmediata\" de una IA frente a la dificultad de conseguir una cita presencial conmigo.",
        "Otro (especificar)."] },
  { q: "Ante la creciente tendencia de pacientes que utilizan IA para \"cuestionar\" o \"validar\" una indicación médica, ¿cómo cree que cambiará su rol en el consultorio?",
    o: ["Evolucionaré hacia un rol de \"curador de información\", ayudando al paciente a filtrar qué datos de la IA son válidos para su caso.",
        "Mantendré mi rol de autoridad técnica, desalentando el uso de herramientas no validadas por mí.",
        "Se volverá una relación más conflictiva, requiriendo más tiempo para desmentir mitos tecnológicos.",
        "Me obligará a estar más actualizado que nunca para responder a preguntas de alta complejidad técnica."] },
  { q: "¿Qué tan útil consideraría una funcionalidad de IA que le genere un \"Resumen para el Paciente\" en lenguaje sencillo después de cada consulta?",
    o: ["Muy útil: mejoraría drásticamente la comprensión y la adherencia post-consulta.",
        "Útil, siempre que yo pueda editar el resumen antes de que se envíe.",
        "Poco útil: prefiero explicarlo verbalmente para asegurar que no haya malentendidos.",
        "Riesgoso: temo que el paciente use ese resumen de forma incorrecta o fuera de contexto."] },
  { q: "¿Cómo imagina que será la \"consulta ideal\" en términos de equilibrio tecnológico en los próximos años?",
    o: ["Presencial pura: la tecnología debe quedar fuera del consultorio para preservar la conexión humana.",
        "Híbrida asistida: consulta presencial donde la IA escucha y asiste discretamente sin interrumpir el contacto visual.",
        "Virtual/Digital: consultas rápidas por IA para temas menores y presencialidad solo para procedimientos o casos graves.",
        "Basada en datos: el paciente llega con sus datos ya analizados por una IA y la consulta se centra solo en la decisión terapéutica."] }
];
const LETRAS = "ABCDE";
const respuestas = new Array(PREGUNTAS.length).fill(null);
let actual = 0;
let volverAResumen = false;

const $ = id => document.getElementById(id);

function pintarProgreso() {
  const hechas = respuestas.filter(r => r !== null).length;
  $("bar").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("count").textContent = hechas + " de " + PREGUNTAS.length + " respondidas";
}

function mostrarPregunta(i) {
  actual = i;
  const p = PREGUNTAS[i];
  $("tema").textContent = TEMA_ENCUESTA;
  $("quiz").classList.remove("hidden");
  $("summary").classList.add("hidden");
  $("qnum").textContent = "Pregunta " + (i + 1);
  $("qtext").textContent = p.q;
  const cont = $("opts");
  cont.innerHTML = "";
  p.o.forEach((texto, j) => {
    const b = document.createElement("button");
    b.className = "opt" + (respuestas[i] === j ? " sel" : "");
    b.innerHTML = '<span class="letter">' + LETRAS[j] + '</span><span></span>';
    b.lastChild.textContent = texto;
    b.onclick = () => elegir(j);
    cont.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = volverAResumen ? "Volver al resumen" : (i === PREGUNTAS.length - 1 ? "Ver resumen" : "Siguiente");
  pintarProgreso();
  window.scrollTo(0, 0);
}

function elegir(j) {
  respuestas[actual] = j;
  [...$("opts").children].forEach((el, k) => el.classList.toggle("sel", k === j));
  pintarProgreso();
  setTimeout(avanzar, 450);
}

function avanzar() {
  if (volverAResumen || actual === PREGUNTAS.length - 1) { mostrarResumen(); return; }
  mostrarPregunta(actual + 1);
}

function mostrarResumen() {
  volverAResumen = true;
  $("quiz").classList.add("hidden");
  $("summary").classList.remove("hidden");
  const rows = $("rows");
  rows.innerHTML = "";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    const b = document.createElement("button");
    b.className = "row" + (r === null ? " missing" : "");
    const num = document.createElement("b");
    num.textContent = (i + 1) + ".";
    const ans = document.createElement("span");
    ans.className = "ans";
    ans.textContent = r === null ? "Falta responder" : LETRAS[r] + ") " + p.o[r];
    const ch = document.createElement("span");
    ch.className = "change";
    ch.textContent = r === null ? "Tocá para responder" : "Tocá para cambiar";
    ans.appendChild(ch);
    b.append(num, ans);
    b.onclick = () => mostrarPregunta(i);
    rows.appendChild(b);
  });
  pintarProgreso();
  actualizarLinkEnvio();
  window.scrollTo(0, 0);
}

function actualizarLinkEnvio() {
  const base = WHATSAPP_NUMERO ? "https://wa.me/" + WHATSAPP_NUMERO : "https://wa.me/";
  const url = base + "?text=" + encodeURIComponent(armarMensaje());
  $("send").href = url;
  const fb = $("fallback");
  fb.innerHTML = "";
  const a = document.createElement("a");
  a.href = url;
  a.target = "_top";
  a.rel = "noopener";
  a.textContent = "¿No pasó nada? Tocá acá";
  a.style.color = "var(--muted)";
  fb.appendChild(a);
}

function armarMensaje() {
  let txt = "Respuestas encuesta " + TEMA_ENCUESTA + ":\n\n";
  PREGUNTAS.forEach((p, i) => {
    const r = respuestas[i];
    txt += (i + 1) + ") " + (r === null ? "SIN RESPONDER" : LETRAS[r] + " - " + p.o[r]) + "\n\n";
  });
  return txt.trim();
}

function faltantes() { return respuestas.filter(r => r === null).length; }

$("prev").onclick = () => { if (actual > 0) mostrarPregunta(actual - 1); };
$("next").onclick = avanzar;

$("send").addEventListener("click", (ev) => {
  const f = faltantes();
  if (f > 0 && !confirm("Faltan " + f + " respuesta(s). ¿Enviar igual?")) { ev.preventDefault(); return; }
  // el href ya está armado por actualizarLinkEnvio(); el navegador sigue el link de forma nativa
});

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(armarMensaje());
    $("toast").textContent = "Respuestas copiadas";
  } catch (e) {
    $("toast").textContent = "No se pudo copiar. Usá el botón verde.";
  }
};

mostrarPregunta(0);
</script>
</body>
</html>
